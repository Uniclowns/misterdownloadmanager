# #1365's screenshots (PR #1482), second run: the tray icon's panel with more than five downloads
# and long names, in English, German and Arabic. Lives only on the fork's pr-shots-run-1365
# branch; not part of the PR.
name: PR shots 1365
on:
  workflow_dispatch:
  push:
    branches: ["pr-shots-run-1365"]
permissions:
  contents: read
jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - name: Target folder
        run: '"CARGO_TARGET_DIR=$env:RUNNER_TEMP\t" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup show active-toolchain; if (-not $?) { rustup toolchain install }
      - name: NASM
        shell: pwsh
        run: |
          choco install nasm --version 2.16.3 --no-progress -y
          "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - name: Software OpenGL (Mesa llvmpipe)
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z"
          Invoke-WebRequest -UseBasicParsing $url -OutFile "$env:RUNNER_TEMP\mesa.7z"
          $sum = (Get-FileHash "$env:RUNNER_TEMP\mesa.7z" -Algorithm SHA256).Hash
          if ($sum -ne "351FC8C8B695878FFB3EAA044B3EAD08672A48B1A045E3C3E3975811DF0F6695") { throw "mesa checksum $sum" }
          7z e "$env:RUNNER_TEMP\mesa.7z" "-o$env:RUNNER_TEMP\mesa" x64\opengl32.dll x64\libgallium_wgl.dll -y
          if ($LASTEXITCODE) { throw "7z $LASTEXITCODE" }
      - name: Build after (this branch)
        run: |
          cargo build -p mdm-app -p mdm-labserver
          if ($LASTEXITCODE) { throw "build $LASTEXITCODE" }
          $b = "$env:RUNNER_TEMP\bin-after"; New-Item -ItemType Directory -Force $b | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR\debug\misterdownloadmanager.exe", "$env:CARGO_TARGET_DIR\debug\labserver.exe", "$env:RUNNER_TEMP\mesa\*.dll" $b
      - name: Screenshots, more than five with long names
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          $ErrorActionPreference = "Stop"
          $out = "$env:RUNNER_TEMP\shots"
          New-Item -ItemType Directory -Force $out | Out-Null
          $bin = "$env:RUNNER_TEMP\bin-after"; $exe = "$bin\misterdownloadmanager.exe"
          $names = @{ en = "Downloads in progress"; de = "Aktive Downloads"; ar = "التنزيلات الجارية" }
          foreach ($lang in "en", "de", "ar") {
            $work = "C:\Many-$lang"
            New-Item -ItemType Directory -Force "$work\data", "$work\Downloads" | Out-Null
            Set-Content -Encoding utf8 "$work\data\downloads.json" ('{"next_id":1,"items":[],"version":2,"settings":{"language":"' + $lang + '","language_asked":true,"helpers_asked":true,"extension_never_ask":true,"update_check":false,"torrent_incoming":false,"torrent_upnp":false,"torrent_dht":false,"torrent_lsd":false,"show_progress":false}}')
            $srv = Start-Process -PassThru -WindowStyle Hidden "$bin\labserver.exe" -ArgumentList "--bind 127.0.0.1:8098"
            $env:MDM_DATA_DIR = "$work\data"; $env:MDM_OFFSCREEN = "1"; $env:MDM_OFFSCREEN_AT = "40,40"
            $app = Start-Process -PassThru $exe
            Start-Sleep 6
            $files = @(
              "Open-Movie-Night-2026-The-Complete-Directors-Cut-Extended-Edition-2160p-HDR-Remastered.mkv",
              "ubuntu-26.04-desktop-amd64.iso", "fedora-workstation-45-x86_64-live.iso",
              "project-backup-november-2026-full-with-every-attachment-and-the-old-mail-archive.7z",
              "podcast-season-3-all-episodes.zip", "open-data-2026-census-tables.csv", "rust-1.99.1-x86_64.msi"
            )
            foreach ($f in $files) {
              & $exe /d "http://127.0.0.1:8098/gen/4G/$($f)?rate=64K" /p "$work\Downloads" /n
              Start-Sleep -Milliseconds 500
            }
            Start-Sleep 6
            & $exe /show tray-panel
            Start-Sleep 5
            & tools\lab\cap-own.ps1 -ProcessId $app.Id -Title $names[$lang] -Out "$out\panel-$lang-many.png"
            Stop-Process -Id $app.Id -ErrorAction SilentlyContinue
            Stop-Process -Id $srv.Id -ErrorAction SilentlyContinue
            Get-CimInstance Win32_Process -Filter "Name='misterdownloadmanager.exe'" | ForEach-Object { Stop-Process -Id $_.ProcessId -ErrorAction SilentlyContinue }
            Start-Sleep 2
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pr-shots-1365-many
          path: ${{ runner.temp }}/shots
