# #1525's screenshots: Options → Archives before (upstream main) and after (this branch),
# English, German and Arabic, light and dark, the page with a chosen program, and the help
# picture remade by tools/shots/make.py. Lives only on the fork's pr-shots-run-1525 branch; not
# part of the PR.
name: PR shots 1525
on:
  workflow_dispatch:
  push:
    branches: ["pr-shots-run-1525"]
permissions:
  contents: read
jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - name: Target folder
        run: '"CARGO_TARGET_DIR=$env:RUNNER_TEMP\t" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: anefzaoui/misterdownloadmanager
          ref: main
          path: _before
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Pillow
        run: python -m pip install --quiet pillow
      - name: Toolchain
        run: rustup show active-toolchain; if (-not $?) { rustup toolchain install }
      - name: NASM
        shell: pwsh
        run: |
          choco install nasm --version 2.16.3 --no-progress -y
          "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - name: Software OpenGL (Mesa llvmpipe)
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z"
          Invoke-WebRequest -UseBasicParsing $url -OutFile "$env:RUNNER_TEMP\mesa.7z"
          $sum = (Get-FileHash "$env:RUNNER_TEMP\mesa.7z" -Algorithm SHA256).Hash
          if ($sum -ne "351FC8C8B695878FFB3EAA044B3EAD08672A48B1A045E3C3E3975811DF0F6695") { throw "mesa checksum $sum" }
          7z e "$env:RUNNER_TEMP\mesa.7z" "-o$env:RUNNER_TEMP\mesa" x64\opengl32.dll x64\libgallium_wgl.dll -y
          if ($LASTEXITCODE) { throw "7z $LASTEXITCODE" }
      - name: Build before (upstream main)
        working-directory: _before
        run: |
          cargo build -p mdm-app -p mdm-labserver
          if ($LASTEXITCODE) { throw "build $LASTEXITCODE" }
          $b = "$env:RUNNER_TEMP\bin-before"; New-Item -ItemType Directory -Force $b | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR\debug\misterdownloadmanager.exe", "$env:CARGO_TARGET_DIR\debug\labserver.exe", "$env:RUNNER_TEMP\mesa\*.dll" $b
      - name: Build after (this branch)
        run: |
          cargo build -p mdm-app -p mdm-labserver
          if ($LASTEXITCODE) { throw "build $LASTEXITCODE" }
          $b = "$env:RUNNER_TEMP\bin-after"; New-Item -ItemType Directory -Force $b | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR\debug\misterdownloadmanager.exe", "$env:CARGO_TARGET_DIR\debug\labserver.exe", "$env:RUNNER_TEMP\mesa\*.dll" $b
      - name: Tests (7-Zip, catalogs)
        run: |
          cargo test -p mdm-extract --lib
          if ($LASTEXITCODE) { throw "mdm-extract $LASTEXITCODE" }
          cargo test -p mdm-app --bin misterdownloadmanager -- 7zip every_catalog
          if ($LASTEXITCODE) { throw "mdm-app $LASTEXITCODE" }
      - name: Screenshots
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          $ErrorActionPreference = "Stop"
          $out = "$env:RUNNER_TEMP\shots"; New-Item -ItemType Directory -Force $out | Out-Null
          $at = "40,40"; $work = "C:\Demo"
          function Shot($side, $name, $opts) {
            $bin = "$env:RUNNER_TEMP\bin-$side"
            $dir = "$env:RUNNER_TEMP\raw\$name"
            tools\lab\docs-shots.ps1 -Exe "$bin\misterdownloadmanager.exe" -Server "$bin\labserver.exe" -Work $work -At $at -Show "archives=options:archives" -OutDir $dir @opts
            Copy-Item "$dir\archives.png" "$out\$name.png"
          }
          foreach ($side in "before", "after") {
            foreach ($lang in "en", "de", "ar") {
              Shot $side "$side-$lang-light" @{ Lang = $lang }
              Shot $side "$side-$lang-dark" @{ Lang = $lang; Dark = $true }
            }
          }
          # A program chosen: the runner's own 7-Zip, by its path, as Use another program... keeps it.
          $own = (Get-Command 7z.exe).Source | ConvertTo-Json
          foreach ($lang in "en", "de", "ar") {
            Shot "after" "after-$lang-light-chosen" @{ Lang = $lang; Settings = "`"seven_zip_path`":$own" }
          }
          python tools\shots\make.py --only options-archives --bin "$env:RUNNER_TEMP\bin-after" --work $work --at $at
          if ($LASTEXITCODE) { throw "make.py $LASTEXITCODE" }
          New-Item -ItemType Directory -Force "$out\help" | Out-Null
          Copy-Item docs\images\help\options-archives*.webp "$out\help"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pr-shots-1525
          path: ${{ runner.temp }}/shots
